name: asterixdb-cloud-primer

services:
  asterix:
    image: apache/asterixdb:latest
    environment:
      # Without this the JVM sizes its heap from the container's share of host memory, which on a
      # small Docker/Podman VM leaves the node below the ~371 MiB the final cross-collection query
      # needs and it fails with HYR0009.
      - JAVA_OPTS=-Xmx2g
    ports:
      - "${ASTERIX_QUERY_PORT:-19002}:19002"
      - "${ASTERIX_WEB_PORT:-19006}:19006"
    # podman-compose does not materialize Compose config objects, so the file is bind-mounted.
    volumes:
      - ./asterixdb.conf:/conf/asterixdb.conf:ro
    command: -config-file /conf/asterixdb.conf --nc -node-id 1 -cluster-address 127.0.0.1
    depends_on:
      storage:
        condition: service_healthy
      iceberg-storage:
        condition: service_healthy
      nessie:
        condition: service_started
    restart: on-failure

  storage:
    image: adobe/s3mock:4.12.4
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=asterixdb-test
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true
      - COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/data
    volumes:
      - s3mock-data:/data
    healthcheck:
      test: ["CMD", "wget", "--header=Accept:application/json", "--quiet", "--output-document=-",
             "http://localhost:9090/actuator/health"]
      interval: 10s
      timeout: 10s
      retries: 12

  iceberg-storage:
    image: adobe/s3mock:4.12.4
    # S3Mock creates the bucket at startup, so no separate initialization container is
    # needed. Unlike the durable store it gets no volume: run-primer.py reseeds the
    # Iceberg table and the Delta files on every run.
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=iceberg-container
      - COM_ADOBE_TESTING_S3MOCK_STORE_REGION=us-west-2
    ports:
      # The seeder runs on the host and reaches this endpoint as http://localhost:8001.
      - "8001:9090"
    healthcheck:
      test: ["CMD", "wget", "--header=Accept:application/json", "--quiet", "--output-document=-",
             "http://localhost:9090/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  nessie:
    image: ghcr.io/projectnessie/nessie:0.107.5
    ports:
      - "19120:19120"

volumes:
  s3mock-data:
