# Integration Test Suite Configuration
# =====================================

asterixdb:
  url: "http://localhost:19002/query/service"
  health_url: "http://localhost:19002/admin/cluster/summary"
  startup_timeout: 120      # seconds to wait for cluster ACTIVE
  shutdown_timeout: 30       # seconds to wait for graceful stop
  main_class: "org.apache.asterix.api.common.AsterixHyracksIntegrationUtil"
  project_root: "../.."     # relative to this config file
  conf_file: "asterixdb/asterix-app/src/test/resources/cc-main.conf"
  jvm_args: '-Xmx6144m -Dnode.Resolver="org.apache.asterix.external.util.IdentitiyResolverFactory"'

datasets_dir: "../datasets"  # relative to this config file

datasets:
  movie:
    file: "movie_embeddings_384d.json"
    format: "json"
    dimension: 384
    pk_field: "idx"
    vector_field: "embedding"
    record_limit: null         # null = load all (~10000)
    type_schema: "idx: int"
    similarity: "euclidean_squared"

  glove:
    file: "glove-100-angular_train.jsonl"
    format: "json"
    dimension: 100
    pk_field: "idx"
    vector_field: "embedding"
    record_limit: 50000
    type_schema: "idx: int"
    similarity: "cosine"

  gist:
    file: "gist-960-euclidean_train.jsonl"
    format: "json"
    dimension: 960
    pk_field: "idx"
    vector_field: "embedding"
    record_limit: 50000
    type_schema: "idx: int"
    similarity: "euclidean"

# Part 1: Index Creation
# One dataverse per source dataset. Data loaded once into Staging,
# then INSERT INTO each target dataset.
part1_index_creation:
  dataverse_groups:
    - dataverse: "TestMovie"
      source_dataset: "movie"
      train_list_fraction: 0.1
      epsilon: 0.3
      targets:
        - dataset: "Movie"
          include_fields: ["title", "year"]
        - dataset: "MovieNoInclude"
          include_fields: null

    - dataverse: "TestGlove"
      source_dataset: "glove"
      train_list_fraction: 0.1
      epsilon: 0.3
      targets:
        - dataset: "Glove"
          include_fields: null

    - dataverse: "TestGist"
      source_dataset: "gist"
      train_list_fraction: 0.1
      epsilon: 0.3
      targets:
        - dataset: "Gist"
          include_fields: null

# Part 2: ANN Query Recall
part2_ann_query:
  k: 50
  num_query_vectors: 5
  query_start_idx: 100

  test_cases:
    - name: "movie_esq"
      dataverse: "TestMovie"
      dataset: "Movie"
      source_dataset: "movie"
      min_probe_fraction: 0.4
      k_multiplier: 1
      where_clause: null
      recall_warn_threshold: 0.70
      recall_fail_threshold: 0.50

    - name: "movie_esq_filter"
      dataverse: "TestMovie"
      dataset: "Movie"
      source_dataset: "movie"
      min_probe_fraction: 0.4
      k_multiplier: 1
      where_clause: "m.year > 2000"
      recall_warn_threshold: 0.70
      recall_fail_threshold: 0.50

    - name: "glove_cosine"
      dataverse: "TestGlove"
      dataset: "Glove"
      source_dataset: "glove"
      min_probe_fraction: 0.4
      k_multiplier: 1
      where_clause: null
      recall_warn_threshold: 0.70
      recall_fail_threshold: 0.50

    - name: "gist_euclidean"
      dataverse: "TestGist"
      dataset: "Gist"
      source_dataset: "gist"
      min_probe_fraction: 0.4
      k_multiplier: 1
      where_clause: null
      recall_warn_threshold: 0.70
      recall_fail_threshold: 0.50

    - name: "movie_esq_no_include"
      dataverse: "TestMovie"
      dataset: "MovieNoInclude"
      source_dataset: "movie"
      min_probe_fraction: 0.4
      k_multiplier: 1
      where_clause: null
      recall_warn_threshold: 0.70
      recall_fail_threshold: 0.50

# Part 3: Insert/Delete Correctness
# cross_pollination_m=3 replicates each record into the 3 closest leaf clusters at
# bulk-load AND at incremental insert/delete. rng_factor=3 loosens the SPTAG RNG
# thinning so >1 replica is actually admitted (rng_factor=1 is strict and rarely
# replicates). This makes the delete ranges below exercise multi-cluster deletes;
# the index-only ann_verify (PK-only projection) surfaces any replica a broken
# multi-cluster delete left behind.
part3_insert_delete:
  dataverse: "InsertDeleteTest"
  source_dataset: "movie"
  staging_dataset: "Staging"
  train_list_fraction: 0.1
  epsilon: 0.8
  cross_pollination_m: 3
  rng_factor: 3
  initial_load_limit: 5000
  insert_range: [5000, 7999]
  delete_ranges:
    - [2000, 2999]    # from disk component
    - [6000, 6499]    # from memory component
  verify_expected_ranges:
    - [0, 1999]
    - [3000, 4999]
    - [5000, 5999]
    - [6500, 7999]
  verify_deleted_ranges:
    - [2000, 2999]
    - [6000, 6499]
  ann_verify:
    query_pk: 0
    vector_field: "embedding"
    similarity: "euclidean_squared"
    min_probe_fraction: 0.4
    # Contract: with cross_pollination_m = M, k_multiplier needs replica headroom (worst x M) —
    # the top-K buffer budgets RAW tuples and replicas share dqx; DISTINCT dedups only above.
    k_multiplier: 3
    limit: 10000
  targets:
    - dataset: "Movie"

# Part 4: Flush + Compact
part4_flush_compact:
  # Reuses Part 3 dataverse and datasets
  dataverse: "InsertDeleteTest"
  ann_verify:
    query_pk: 0
    vector_field: "embedding"
    similarity: "euclidean_squared"
    min_probe_fraction: 0.4
    # Contract: with cross_pollination_m = M, k_multiplier needs replica headroom (worst x M) —
    # the top-K buffer budgets RAW tuples and replicas share dqx; DISTINCT dedups only above.
    k_multiplier: 3
    limit: 10000
  targets:
    - dataset: "Movie"
  verify_expected_ranges:
    - [0, 1999]
    - [3000, 4999]
    - [5000, 5999]
    - [6500, 7999]
  verify_deleted_ranges:
    - [2000, 2999]
    - [6000, 6499]
