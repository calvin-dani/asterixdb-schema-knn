<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.bp{fill:#EEEDFE;stroke:#534AB7}.bg{fill:#F1EFE8;stroke:#5F5E5A}.bt{fill:#E1F5EE;stroke:#0F6E56}
.tp{fill:#3C3489;font-size:12px;font-weight:600}.sp{fill:#534AB7;font-size:11px}
.tg{fill:#444441;font-size:12px;font-weight:600}.sg{fill:#5F5E5A;font-size:11px}
.tt{fill:#085041;font-size:12px;font-weight:600}.st{fill:#0F6E56;font-size:11px}
.lane{fill:#2C2C2A;font-size:13px;font-weight:600}
.edge{fill:#5F5E5A;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace}
.note{fill:#5F5E5A;font-size:11px}
</style>
<rect width="700" height="470" fill="#FFFFFF"/>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#888780"/></marker></defs>

<rect x="10" y="10" width="13" height="13" rx="3" class="bt"/>
<text x="29" y="21" class="note">component (data at rest)</text>
<rect x="215" y="10" width="13" height="13" rx="3" class="bp"/>
<text x="234" y="21" class="note">process</text>

<text x="12" y="56" class="lane">Flush — no re-routing, no re-sorting</text>
<rect x="12" y="68" width="190" height="46" rx="4" class="bt"/><text x="107" y="87" class="tt" text-anchor="middle">Memory component</text><text x="107" y="103" class="st" text-anchor="middle">VTree in virtual buffer cache</text>
<rect x="255" y="68" width="190" height="46" rx="4" class="bp"/><text x="350" y="87" class="tp" text-anchor="middle">VTreeFlushLoader</text><text x="350" y="103" class="sp" text-anchor="middle">identity page copy</text>
<rect x="498" y="68" width="190" height="46" rx="4" class="bt"/><text x="593" y="87" class="tt" text-anchor="middle">Disk component Dn</text><text x="593" y="103" class="st" text-anchor="middle">self-contained + static tail</text>
<line x1="202" y1="91" x2="253" y2="91" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="445" y1="91" x2="496" y2="91" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="228" y="132" class="edge" text-anchor="middle">VBC page N = disk page N</text>
<text x="566" y="132" class="edge" text-anchor="middle">static pages appended, ptrs offset</text>

<text x="12" y="186" class="lane">Merge — merge is a query</text>
<rect x="12" y="198" width="190" height="46" rx="4" class="bt"/><text x="107" y="217" class="tt" text-anchor="middle">D1 + D2 components</text><text x="107" y="233" class="st" text-anchor="middle">matter + antimatter</text>
<rect x="255" y="198" width="190" height="46" rx="4" class="bp"/><text x="350" y="217" class="tp" text-anchor="middle">Full-scan cursor</text><text x="350" y="233" class="sp" text-anchor="middle">k-way merge, antimatter cancel</text>
<rect x="498" y="198" width="190" height="46" rx="4" class="bt"/><text x="593" y="217" class="tt" text-anchor="middle">Bulk load into D3</text><text x="593" y="233" class="st" text-anchor="middle">survivors only</text>
<line x1="202" y1="221" x2="253" y2="221" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="445" y1="221" x2="496" y2="221" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="228" y="262" class="edge" text-anchor="middle">cluster by cluster, dist-sorted</text>
<text x="566" y="262" class="edge" text-anchor="middle">deletes physically gone</text>

<text x="12" y="316" class="lane">Top-k query — blocked cursor, all work in open()</text>
<rect x="12" y="328" width="140" height="46" rx="4" class="bt"/><text x="82" y="347" class="tt" text-anchor="middle">mem + D1 + D2</text><text x="82" y="363" class="st" text-anchor="middle">one cursor each</text>
<rect x="180" y="328" width="140" height="46" rx="4" class="bp"/><text x="250" y="347" class="tp" text-anchor="middle">PQ merge</text><text x="250" y="363" class="sp" text-anchor="middle">by (dist, PK)</text>
<rect x="348" y="328" width="140" height="46" rx="4" class="bp"/><text x="418" y="347" class="tp" text-anchor="middle">dqx + top-k buffer</text><text x="418" y="363" class="sp" text-anchor="middle">spillable max-heap</text>
<rect x="516" y="328" width="140" height="46" rx="4" class="bg"/><text x="586" y="347" class="tg" text-anchor="middle">Drain</text><text x="586" y="363" class="sg" text-anchor="middle">ascending dqx</text>
<line x1="152" y1="351" x2="178" y2="351" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="320" y1="351" x2="346" y2="351" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="488" y1="351" x2="514" y2="351" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="165" y="392" class="edge" text-anchor="middle">matter/antimatter adjacent</text>
<text x="418" y="408" class="edge" text-anchor="middle">candidateLimit = K x kMultiplier</text>

<text x="12" y="440" class="note">One shared .staticstructure component serves all live memory components; flush/merge embed a fresh copy of the static pages in every disk component.</text>
<text x="12" y="458" class="note">Adjacency reconciliation requires distance-sorted data pages everywhere — the sorted-directory invariant.</text>
</svg>
